name: pipeline-tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unitarias:
    name: Pruebas unitarias puras
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: maven

      - name: Dar permisos al wrapper de Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas
        shell: bash
        run: |
          set +e
          ./mvnw test -Dtest=TextoUtilsTest,RegistroTest,UsuarioServiceDetailsTest | tee test-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          exit $EXIT_CODE

      - name: Resumen de pruebas
        if: always()
        shell: bash
        run: |
          SUMMARY_LINE=$(grep -E "^\[INFO\] Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$" test-output.txt | tail -1)
          RUN=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Tests run: )\d+' || true)
          FAILURES=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Failures: )\d+' || true)
          ERRORS=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Errors: )\d+' || true)
          SKIPPED=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Skipped: )\d+' || true)
          RUN=${RUN:-0}; FAILURES=${FAILURES:-0}; ERRORS=${ERRORS:-0}; SKIPPED=${SKIPPED:-0}
          PASSED=$((RUN - FAILURES - ERRORS - SKIPPED))
          {
            echo "### Pruebas unitarias puras"
            echo ""
            echo '```'
            echo "Pruebas: $PASSED passed, $FAILURES failed, $ERRORS errors, $SKIPPED skipped (de $RUN totales)."
            echo '```'
            if [ "$FAILURES" != "0" ] || [ "$ERRORS" != "0" ]; then
              echo ""
              echo "**Pruebas fallidas:**"
              grep -E "<<< FAILURE|<<< ERROR" test-output.txt || echo "(no se pudo listar el detalle, revisa el log completo)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  unitarias-mockito:
    name: Pruebas unitarias con Mockito
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: maven

      - name: Dar permisos al wrapper de Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas
        shell: bash
        run: |
          set +e
          ./mvnw test -Dtest=RegistroServiceTest,LoginAttemptServiceTest,CategoriaServiceTest,ClienteServiceTest,ComprobanteServiceTest,ConsumoServiceTest,HabitacionServiceTest,ReservaServiceTest,UsuarioServiceTest | tee test-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          exit $EXIT_CODE

      - name: Resumen de pruebas
        if: always()
        shell: bash
        run: |
          SUMMARY_LINE=$(grep -E "^\[INFO\] Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$" test-output.txt | tail -1)
          RUN=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Tests run: )\d+' || true)
          FAILURES=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Failures: )\d+' || true)
          ERRORS=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Errors: )\d+' || true)
          SKIPPED=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Skipped: )\d+' || true)
          RUN=${RUN:-0}; FAILURES=${FAILURES:-0}; ERRORS=${ERRORS:-0}; SKIPPED=${SKIPPED:-0}
          PASSED=$((RUN - FAILURES - ERRORS - SKIPPED))
          {
            echo "### Pruebas unitarias con Mockito"
            echo ""
            echo '```'
            echo "Pruebas: $PASSED passed, $FAILURES failed, $ERRORS errors, $SKIPPED skipped (de $RUN totales)."
            echo '```'
            if [ "$FAILURES" != "0" ] || [ "$ERRORS" != "0" ]; then
              echo ""
              echo "**Pruebas fallidas:**"
              grep -E "<<< FAILURE|<<< ERROR" test-output.txt || echo "(no se pudo listar el detalle, revisa el log completo)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  integracion:
    name: Pruebas de integración (controlador + contexto Spring)
    runs-on: ubuntu-latest

    # Contraseña solo para el contenedor efímero de CI; no es la de ningún entorno real.
    env:
      DB_PASSWORD: "Ci_Pruebas_2026!"

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Pruebas_2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Pruebas_2026!' -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Crear la base alquiler
        run: >-
          docker exec ${{ job.services.sqlserver.id }}
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$DB_PASSWORD"
          -Q "IF DB_ID('alquiler') IS NULL CREATE DATABASE alquiler;"

      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: maven

      - name: Dar permisos al wrapper de Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas
        shell: bash
        run: |
          set +e
          ./mvnw test -Dtest=ConsumoControllerTest,SistemahotelApplicationTests | tee test-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          exit $EXIT_CODE

      - name: Resumen de pruebas
        if: always()
        shell: bash
        run: |
          SUMMARY_LINE=$(grep -E "^\[INFO\] Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$" test-output.txt | tail -1)
          RUN=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Tests run: )\d+' || true)
          FAILURES=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Failures: )\d+' || true)
          ERRORS=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Errors: )\d+' || true)
          SKIPPED=$(echo "$SUMMARY_LINE" | grep -oP '(?<=Skipped: )\d+' || true)
          RUN=${RUN:-0}; FAILURES=${FAILURES:-0}; ERRORS=${ERRORS:-0}; SKIPPED=${SKIPPED:-0}
          PASSED=$((RUN - FAILURES - ERRORS - SKIPPED))
          {
            echo "### Pruebas de integración"
            echo ""
            echo '```'
            echo "Pruebas: $PASSED passed, $FAILURES failed, $ERRORS errors, $SKIPPED skipped (de $RUN totales)."
            echo '```'
            if [ "$FAILURES" != "0" ] || [ "$ERRORS" != "0" ]; then
              echo ""
              echo "**Pruebas fallidas:**"
              grep -E "<<< FAILURE|<<< ERROR" test-output.txt || echo "(no se pudo listar el detalle, revisa el log completo)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
